name: Verify tournament release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./... -count=1
        working-directory: backend
      - run: python -m pip install -r bot-runner/requirements.txt
      - run: sudo sh bot-runner/install-wasi.sh
      - run: python -m unittest discover -s tests/unit -p 'test_*.py'
      - run: python tests/security/test_sandbox_security.py
      - run: node tests/unit/test_offline_submissions.cjs
      - run: python scripts/build_frontend.py
