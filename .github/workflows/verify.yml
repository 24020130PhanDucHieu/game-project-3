name: Verify tournament release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena_test -d arena_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./... -count=1
        working-directory: backend
        env:
          ARENA_TEST_DATABASE_URL: postgres://arena_test:disposable-test-only@127.0.0.1:5432/arena_test?sslmode=disable
      - run: python -m pip install -r bot-runner/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: sudo sh bot-runner/install-wasi.sh
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - run: python -m unittest discover -s tests/unit -p 'test_*.py'
      - run: python -m unittest discover -s tests/security -p 'test_*.py'
      - run: node tests/unit/test_offline_submissions.cjs
      - run: python scripts/build_frontend.py
      - name: Check browser test dependencies
        run: python -c "import requests; from playwright.sync_api import sync_playwright"
      - run: python -m playwright install --with-deps chrome
      - run: go build -o bin/arena-verification ./cmd/server
        working-directory: backend
      - run: python tests/e2e/test_offline_submission_sync.py
        env:
          ARENA_TEST_SERVER: ${{ github.workspace }}/backend/bin/arena-verification
      - run: python tests/e2e/test_submission_queue_recovery.py
        env:
          ARENA_TEST_SERVER: ${{ github.workspace }}/backend/bin/arena-verification
      - run: python tests/e2e/test_multi_worker.py
        env:
          ARENA_TEST_SERVER: ${{ github.workspace }}/backend/bin/arena-verification
      - run: python tests/e2e/test_reliability.py
        env:
          ARENA_TEST_SERVER: ${{ github.workspace }}/backend/bin/arena-verification
      - name: Verify read-only production judge image
        run: |
          docker rm -f arena-judge-smoke 2>/dev/null || true
          docker build -t arena-judge:verification bot-runner
          docker run --rm -d --name arena-judge-smoke --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 1536m --cpus 2 --tmpfs /tmp:rw,size=512m -e WORKER_TOKEN=local-test-token -e WORKER_RELEASE=verification -e WORKER_CAPACITY=2 -p 127.0.0.1::8001 arena-judge:verification
          PORT=$(docker port arena-judge-smoke 8001/tcp | sed 's/.*://')
          echo "Assigned judge smoke test port: $PORT"
          JUDGE_TEST_PORT="$PORT" python tests/e2e/test_judge_image.py
          docker stop arena-judge-smoke 2>/dev/null || true
