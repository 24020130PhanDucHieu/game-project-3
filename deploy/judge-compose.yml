# Run one copy per private judge VM. Use the SAME Git commit/image on all judges.
# docker compose --env-file /etc/arena/judge.env -f deploy/judge-compose.yml up -d --build
services:
  judge:
    build:
      context: ../bot-runner
    image: arena-judge:${ARENA_RELEASE:-local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: ${JUDGE_MEMORY_LIMIT:-700m}
    cpus: ${JUDGE_CPUS:-1.5}
    tmpfs:
      - /tmp:size=134217728,mode=1777
    environment:
      ENVIRONMENT: production
      PYTHONDONTWRITEBYTECODE: "1"
      WORKER_CAPACITY: ${WORKER_CAPACITY:-1}
      WORKER_RELEASE: ${ARENA_RELEASE:?Set the exact deployed Git commit}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set a shared private worker token}
    ports:
      - "${JUDGE_PRIVATE_IP:?Set this VM private IP}:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
