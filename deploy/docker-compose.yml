version: "3.8"

services:
  arena-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ottv2-arena:latest
    container_name: ottv2-arena-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENVIRONMENT=production
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=600
      - RATE_LIMIT_SUBMIT_PER_MINUTE=60
      - DB_PATH=/var/lib/arena/tournaments_store.json
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the deployment environment}
    volumes:
      - arena-data:/var/lib/arena
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  arena-data:
    driver: local
