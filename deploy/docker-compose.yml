version: "3.8"

services:
  arena-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ottv2-arena:latest
    container_name: ottv2-arena-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=600
      - RATE_LIMIT_SUBMIT_PER_MINUTE=60
      - STORAGE_DEBOUNCE_SEC=1.0
    volumes:
      - arena-data:/app/data
      - arena-backups:/app/database/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  arena-data:
    driver: local
  arena-backups:
    driver: local
