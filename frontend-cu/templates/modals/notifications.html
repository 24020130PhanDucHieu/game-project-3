<!-- Modal Trung Tâm Thông Báo -->
<div class="modal-backdrop" id="modal-notifications" style="display: none;" onclick="if(event.target===this)closeNotificationModal()">
  <div class="modal-dialog modal-md" role="dialog" aria-modal="true" aria-labelledby="notif-modal-title" style="max-width: 560px;">
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #e2e8f0;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg class="arena-icon" style="color: #2563eb; width: 20px; height: 20px;" aria-hidden="true"><use href="#icon-bell"></use></svg>
        <h3 id="notif-modal-title" style="margin: 0; font-size: 17px; font-weight: 700; color: #0f172a;">Trung tâm thông báo</h3>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="btn btn-sm btn-outline" id="btn-notif-mark-all-read" onclick="markAllNotificationsAsRead()" type="button" title="Đánh dấu tất cả thông báo đã đọc">
          Đánh dấu đã đọc
        </button>
        <button class="btn-clean close-btn" onclick="closeNotificationModal()" type="button" aria-label="Đóng">&times;</button>
      </div>
    </div>

    <!-- Admin Broadcast Toggle & Form -->
    <div class="admin-only" id="admin-broadcast-section" style="padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: none;">
      <details>
        <summary style="font-size: 13px; font-weight: 600; color: #2563eb; cursor: pointer;">📢 Phát thông báo mới từ Ban Tổ Chức</summary>
        <form onsubmit="handleAdminBroadcast(event)" style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="broadcast-title" class="input-modern" placeholder="Tiêu đề thông báo..." required maxlength="120" style="font-size: 13px; padding: 8px 12px;">
          <textarea id="broadcast-message" class="input-modern" placeholder="Nội dung thông báo tới toàn thể thí sinh..." rows="2" required maxlength="500" style="font-size: 13px; padding: 8px 12px;"></textarea>
          <div style="display: flex; gap: 8px; justify-content: space-between; align-items: center;">
            <select id="broadcast-tab" class="input-text-sm" style="font-size: 12px;">
              <option value="overview">Điều hướng: Tổng quan</option>
              <option value="bracket">Điều hướng: Bảng đấu</option>
              <option value="qualifier">Điều hướng: Vòng loại</option>
              <option value="match-arena">Điều hướng: Trận đấu</option>
              <option value="guide">Điều hướng: Hướng dẫn</option>
            </select>
            <button class="btn btn-sm btn-primary" type="submit" id="btn-broadcast-submit">Gửi thông báo</button>
          </div>
        </form>
      </details>
    </div>

    <!-- Notification List -->
    <div id="notifications-list-container" style="max-height: 420px; overflow-y: auto; padding: 8px 12px;">
      <div id="notifications-empty-state" style="text-align: center; padding: 36px 20px; color: #64748b;">
        <svg class="arena-icon" style="width: 36px; height: 36px; margin-bottom: 10px; opacity: 0.5;" aria-hidden="true"><use href="#icon-bell"></use></svg>
        <p style="margin: 0; font-size: 14px; font-weight: 500;">Chưa có thông báo nào mới.</p>
        <p style="margin: 4px 0 0; font-size: 12px; color: #94a3b8;">Các cập nhật giải đấu, lịch thi và kết quả sẽ hiển thị tại đây.</p>
      </div>
      <div id="notifications-items"></div>
    </div>
  </div>
</div>
