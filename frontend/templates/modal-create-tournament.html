<div class="modal-overlay" id="modal-create-tournament" style="display: none;">
<div class="modal-card">
<div class="modal-header">
<h3 class="modal-title">Tạo Giải Đấu Lập Trình Mới</h3>
<button class="btn-clean btn-modal-close" id="btn-close-create-tourn-x">✕</button>
</div>
<div class="modal-body">
<div class="form-group">
<label class="form-label">Tên Giải Đấu:</label>
<input class="input-text" id="inp-new-tourn-name" placeholder="Ví dụ: Cúp Vô Địch Tân Sinh Viên K69..." type="text" value="Giải Đấu ICPC K69 Mùa 2"/>
</div>
<div class="form-group">
<label class="form-label">Số Lượng Đội Tham Gia:</label>
<input class="input-text" id="inp-new-tourn-teams" min="4" placeholder="Nhập số đội: 4, 8, 16, 32..." step="1" type="number" value="8"/>
<small class="form-hint">Quy tắc bắt buộc: Số lượng đội phải là lũy thừa của 2 (ví dụ: 4, 8, 16, 32...) và tối thiểu 4 đội để tạo nhánh đấu loại trực tiếp hợp lệ.</small>
</div>
</div>
<div class="modal-footer">
<button class="btn btn-outline" id="btn-close-create-tourn">Hủy</button>
<button class="btn btn-primary" id="btn-submit-create-tourn">Khởi Tạo Giải Đấu</button>
</div>
</div>
</div>
