<div class="modal-overlay" id="modal-manage-teams" style="display: none;" onclick="if(event.target === this) closeTeamManagerModal()">
  <div class="modal-card modal-team-mgr-card">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #eff6ff; display: flex; align-items: center; justify-content: center; color: #2563eb; flex-shrink: 0;">

        </div>
        <div>
          <h3 class="modal-title" style="margin: 0; font-size: 16px; font-weight: 700;">Quản Lý Tuyển Thủ &amp; Đội Thi Đấu</h3>
          <span class="modal-subtitle" style="font-size: 12px; color: #64748b;">Thêm, xóa thành viên và bốc thăm ngẫu nhiên vào sơ đồ nhánh</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge-tag highlight" id="mgr-teams-count-badge" style="font-size: 11px; padding: 4px 8px; border-radius: 8px;">0 / 8 Đội</span>
        <button class="btn-clean btn-modal-close" id="btn-close-team-mgr-x" onclick="closeTeamManagerModal()">Đóng</button>
      </div>
    </div>
    <div class="modal-body" style="padding: 16px 20px;">

      <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;">
        <div style="font-size: 12px; font-weight: 700; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
          <span>Ghi danh đội tuyển mới:</span>
        </div>
        <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 8px; align-items: center;">
          <input class="input-modern" id="mgr-inp-name" placeholder="Tên Đội (ví dụ: K69_AlphaBot)" type="text" style="font-size: 12.5px; padding: 7px 10px;"/>
          <input class="input-modern" id="mgr-inp-sid" placeholder="MSSV (ví dụ: 24020001)" type="text" style="font-size: 12.5px; padding: 7px 10px;"/>
          <input class="input-modern" id="mgr-inp-uni" placeholder="Đơn vị (ví dụ: ĐHQG Hà Nội)" type="text" value="Khối Kỹ Thuật" style="font-size: 12.5px; padding: 7px 10px;"/>
          <button class="btn btn-primary" id="btn-mgr-add-team" style="padding: 7px 14px; font-size: 12.5px; font-weight: 600; white-space: nowrap;">
<svg class="arena-icon " aria-hidden="true" focusable="false"><use href="#icon-plus"></use></svg>+ Thêm Đội</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
        <div style="font-size: 12.5px; font-weight: 700; color: #0f172a;">Danh sách đội đã tham gia giải:</div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline btn-sm" id="btn-mgr-quick-fill" title="Điền nhanh các đội mẫu để kiểm thử giải đấu" style="font-size: 11.5px; padding: 5px 10px;">
<svg class="arena-icon " aria-hidden="true" focusable="false"><use href="#icon-sparkles"></use></svg>
             Nạp Nhanh Đội Mẫu
          </button>
          <button class="btn btn-primary btn-sm" id="btn-mgr-auto-schedule" title="Tự động bốc thăm ngẫu nhiên các đội vào nhánh đấu của giải" style="font-size: 11.5px; padding: 5px 12px; background: #16a34a; border-color: #16a34a;">
<svg class="arena-icon " aria-hidden="true" focusable="false"><use href="#icon-bracket"></use></svg>
             Bốc Thăm &amp; Chia Nhánh Ngẫu Nhiên
          </button>
        </div>
      </div>

      <div class="table-responsive" style="max-height: 240px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px;">
        <table class="table-clean" id="table-mgr-teams" style="width: 100%; margin: 0;">
          <thead style="background: #f8fafc; position: sticky; top: 0; z-index: 1;">
            <tr>
              <th style="padding: 8px 10px; font-size: 11.5px;">Hạt Giống</th>
              <th style="padding: 8px 10px; font-size: 11.5px;">Tên Đội</th>
              <th style="padding: 8px 10px; font-size: 11.5px;">MSSV / SBD</th>
              <th style="padding: 8px 10px; font-size: 11.5px;">Đơn Vị</th>
              <th style="padding: 8px 10px; font-size: 11.5px; text-align: center;">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="tbody-mgr-teams">
            <tr><td colspan="5" class="text-center text-muted" style="padding: 20px;">Chưa có đội nào tham gia giải này.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer" style="padding: 12px 20px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px;">
      <button class="btn btn-outline" id="btn-close-team-mgr" onclick="closeTeamManagerModal()">Đóng</button>
    </div>
  </div>
</div>
