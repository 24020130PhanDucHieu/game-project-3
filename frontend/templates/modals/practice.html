<div class="modal-overlay" id="modal-practice-arena" style="display: none;" onclick="if(event.target === this) closePracticeArenaModal()">
  <div class="modal-card modal-lg">
    <div class="modal-header">
      <div>
        <h3 class="modal-title" id="practice-title">Đấu Thử Nghiệm Với Bot BTC</h3>
        <span class="modal-subtitle">Kiểm tra chiến thuật di chuyển và ăn quân trên bàn cờ 9×9</span>
      </div>
      <button class="btn-clean btn-modal-close modal-close-icon" id="btn-close-practice-x" type="button" aria-label="Đóng hộp thoại" title="Đóng"><svg class="arena-icon" aria-hidden="true" focusable="false"><use href="#icon-close"></use></svg></button>
    </div>
    <div class="modal-body">
      <div class="board-top-status-bar" style="margin-bottom: 10px;">
        <div class="board-team-pill red"><strong id="practice-name-red">Bot Của Bạn (Đỏ)</strong></div>
        <div class="arena-round-indicator">BÀN ĐẤU THỬ</div>
        <div class="board-team-pill blue"><strong id="practice-name-blue">Bot Mẫu BTC (Xanh)</strong></div>
      </div>
      <div class="board-wrapper"><div class="chessboard-9x9" id="practice-chessboard-9x9"></div></div>
      <div class="live-commentary-ticker" id="practice-commentary-ticker" style="margin-top: 10px;">Đang chạy mô phỏng...</div>
    </div>
  </div>
</div>
