<div class="modal-overlay" id="modal-create-tournament" style="display: none;" onclick="if(event.target === this) closeCreateTournModal()">
  <div class="modal-card modal-tourn-create-card">
    <div class="modal-header">
      <div class="modal-title-group">
        <div>
          <h3 class="modal-title">Tạo Giải Đấu Lập Trình Mới</h3>
          <span class="modal-subtitle">Thiết lập quy mô bảng đấu loại trực tiếp tự động</span>
        </div>
      </div>
      <button class="btn-clean btn-modal-close" id="btn-close-create-tourn-x" onclick="closeCreateTournModal()">Đóng</button>
    </div>
    <div class="modal-body">
      <div class="form-group-modern">
        <label class="form-label-modern" for="inp-new-tourn-name">
          <span>Tên Giải Đấu</span>
          <span class="badge-req">Bắt buộc</span>
        </label>
        <input class="input-modern" id="inp-new-tourn-name" placeholder="Ví dụ: Cúp Vô Địch Tân Sinh Viên K69..." type="text" value="Giải Đấu ICPC K69 Mùa 2"/>
      </div>

      <div class="form-group-modern" style="margin-top: 14px;">
        <label class="form-label-modern" for="inp-new-tourn-teams">
          <span>Số Lượng Đội Tham Gia</span>
          <span class="badge-req">Lũy thừa của 2</span>
        </label>

        <div class="tourn-size-presets">
          <button type="button" class="preset-pill-btn" onclick="selectTournSizePreset(4)">4 Đội</button>
          <button type="button" class="preset-pill-btn active" onclick="selectTournSizePreset(8)">8 Đội</button>
          <button type="button" class="preset-pill-btn" onclick="selectTournSizePreset(16)">16 Đội</button>
          <button type="button" class="preset-pill-btn" onclick="selectTournSizePreset(32)">32 Đội</button>
        </div>
        <input class="input-modern" id="inp-new-tourn-teams" min="4" max="64" placeholder="Nhập số đội: 4, 8, 16, 32..." step="1" type="number" value="8" oninput="updateTournSizePreview(this.value)"/>

        <div class="tourn-format-preview-card" id="tourn-format-preview">
          <span class="preview-tag">Sơ đồ nhánh:</span>
          <span id="tourn-format-preview-text">Tứ Kết (4 trận) → Bán Kết (2 trận) → Chung Kết (1 trận)</span>
        </div>
      </div>

      <div class="form-info-tip" style="margin-top: 14px;">

        <span>Quy tắc: Hệ thống tự động chia cặp đấu loại trực tiếp (Bo6). Chỉ Ban Tổ Chức (Admin) mới có quyền tạo giải.</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btn-close-create-tourn" onclick="closeCreateTournModal()">Hủy</button>
      <button class="btn btn-primary" id="btn-submit-create-tourn">Khởi Tạo Giải Đấu</button>
    </div>
  </div>
</div>
