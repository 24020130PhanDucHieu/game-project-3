# =============================================================================
# NGINX HIGH-PERFORMANCE REVERSE PROXY CONFIGURATION
# Phục vụ 5,000+ kết nối đồng thời với WebSocket, Gzip, Connection Pooling
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tối ưu hóa I/O Kernel
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Giới hạn kích thước bài nộp Bot (Tối đa 2MB)
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Upstream Connection Pooling tới Uvicorn
    upstream ottv2_backend {
        server 127.0.0.1:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name arena.yourdomain.com localhost;

        # Gzip Compression
        gzip on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Static Frontend Caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {
            root /var/www/project-tuan3/frontend;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # WebSocket Reverse Proxy
        location /ws/ {
            proxy_pass http://ottv2_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # API & App Endpoints
        location / {
            proxy_pass http://ottv2_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }
    }
}
